name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build -- --ci -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: aero-player-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/aero-player.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
